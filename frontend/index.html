<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat Assistant — Intelligent Conversations</title>
    <meta
      name="description"
      content="A premium AI chat assistant powered by GPT-4o with real-time streaming, conversation history, and tone customization."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app-shell" id="app-shell">

      <!-- ═══════════════════════════════════════════════════════
           SIDEBAR — Conversation History
      ═══════════════════════════════════════════════════════ -->
      <aside class="sidebar" id="sidebar" role="complementary" aria-label="Conversation history">
        <div class="sidebar-header">
          <div class="sidebar-logo">
            <div class="logo-icon" aria-hidden="true">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z" fill="currentColor" opacity="0.3"/>
                <circle cx="12" cy="12" r="3" fill="currentColor"/>
                <path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </div>
            <span class="logo-text">NexusAI</span>
          </div>
          <button
            class="btn-new-chat"
            id="btn-new-chat"
            title="Start a new conversation"
            aria-label="Start new conversation"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>New Chat</span>
          </button>
        </div>

        <div class="sidebar-search">
          <input
            type="search"
            id="sidebar-search-input"
            class="search-input"
            placeholder="Search conversations..."
            aria-label="Search conversations"
          />
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>

        <div class="sidebar-section-label">Recent Conversations</div>

        <nav class="conversation-list" id="conversation-list" aria-label="Conversation threads">
          <div class="sidebar-empty" id="sidebar-empty">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <p>No conversations yet.<br/>Start a new chat!</p>
          </div>
        </nav>

        <div class="sidebar-footer">
          <div class="sidebar-stats" id="sidebar-stats"></div>
        </div>
      </aside>

      <!-- ═══════════════════════════════════════════════════════
           MAIN — Chat Area
      ═══════════════════════════════════════════════════════ -->
      <main class="chat-main" role="main">

        <!-- TOP BAR -->
        <header class="chat-topbar" id="chat-topbar">
          <button class="btn-sidebar-toggle" id="btn-sidebar-toggle" aria-label="Toggle sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>

          <div class="topbar-center">
            <h1 class="chat-title" id="chat-title">New Conversation</h1>
            <div class="streaming-indicator" id="streaming-indicator" aria-live="polite">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
              <span>AI is thinking...</span>
            </div>
          </div>

          <!-- TONE TOGGLE -->
          <div class="tone-toggle" role="group" aria-label="Select AI response tone">
            <span class="tone-label">Tone:</span>
            <div class="tone-buttons">
              <button
                class="tone-btn active"
                id="tone-professional"
                data-tone="professional"
                aria-pressed="true"
                title="Professional — formal and structured"
              >
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
                Professional
              </button>
              <button
                class="tone-btn"
                id="tone-casual"
                data-tone="casual"
                aria-pressed="false"
                title="Casual — friendly and conversational"
              >
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                Casual
              </button>
              <button
                class="tone-btn"
                id="tone-concise"
                data-tone="concise"
                aria-pressed="false"
                title="Concise — brief and to the point"
              >
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                Concise
              </button>
            </div>
          </div>
        </header>

        <!-- MESSAGES VIEWPORT -->
        <section class="messages-viewport" id="messages-viewport" aria-label="Chat messages" aria-live="polite">
          <!-- Welcome screen shown when no messages -->
          <div class="welcome-screen" id="welcome-screen">
            <div class="welcome-glow" aria-hidden="true"></div>
            <div class="welcome-icon" aria-hidden="true">
              <svg width="56" height="56" viewBox="0 0 24 24" fill="none">
                <defs>
                  <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#a78bfa"/>
                    <stop offset="100%" style="stop-color:#60a5fa"/>
                  </linearGradient>
                </defs>
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" fill="url(#grad1)" opacity="0.15"/>
                <path d="M8 10h8M8 14h5" stroke="url(#grad1)" stroke-width="1.5" stroke-linecap="round"/>
                <circle cx="12" cy="12" r="9" stroke="url(#grad1)" stroke-width="1.5"/>
              </svg>
            </div>
            <h2 class="welcome-title">How can I help you today?</h2>
            <p class="welcome-subtitle">Ask me anything. I adapt my tone to match your preference.</p>
            <div class="welcome-chips">
              <button class="chip" id="chip-1" data-prompt="Explain quantum computing in simple terms">⚛️ Explain quantum computing</button>
              <button class="chip" id="chip-2" data-prompt="Write a professional email declining a meeting">✉️ Draft a professional email</button>
              <button class="chip" id="chip-3" data-prompt="Give me 5 productivity tips for deep work">🎯 Productivity tips</button>
              <button class="chip" id="chip-4" data-prompt="What are the key differences between REST and GraphQL?">🔗 REST vs GraphQL</button>
            </div>
          </div>

          <!-- Messages are injected here by ui.js -->
          <div class="messages-container" id="messages-container"></div>
        </section>

        <!-- INPUT AREA -->
        <footer class="input-area" role="contentinfo">
          <div class="input-wrapper" id="input-wrapper">
            <textarea
              id="message-input"
              class="message-input"
              placeholder="Ask me anything..."
              rows="1"
              maxlength="4000"
              aria-label="Type your message"
              aria-multiline="true"
            ></textarea>
            <div class="input-actions">
              <span class="char-count" id="char-count" aria-live="polite"></span>
              <button
                class="btn-send"
                id="btn-send"
                title="Send message (Enter)"
                aria-label="Send message"
                disabled
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13"></line>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
              </button>
            </div>
          </div>
          <p class="input-hint">Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</p>
        </footer>
      </main>
    </div>

    <!-- Toast notification container -->
    <div class="toast-container" id="toast-container" aria-live="assertive"></div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
